<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きょうプレ！ メタゲーム・マトリクス</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .deck-cell-bg {
            position: relative;
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }
        
        /* 文字の視認性を確保するためのオーバーレイ */
        .deck-cell-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 100%);
            transition: opacity 0.3s;
        }

        .header-cell-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 100%);
        }

        .cell-hover:hover { transform: scale(1.05); z-index: 20; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <div id="app" class="p-4 md:p-8 max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border-b border-slate-800 pb-8">
            <div>
                <div class="bg-yellow-500 text-black font-black px-2 py-0.5 rounded text-xs italic w-fit mb-1 uppercase">Kyo-Pre! AI Manager</div>
                <h1 class="text-3xl font-black tracking-tighter uppercase">Meta-Matrix <span class="text-yellow-500">ND</span></h1>
            </div>
            <div class="text-right">
                <div class="flex items-center gap-2 bg-slate-900 px-3 py-1 rounded-full border border-slate-800 mb-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Live Data Feed</span>
                </div>
                <p class="text-[9px] text-slate-600 font-mono italic uppercase">Last Sync: 2025.12.23.2045</p>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area">
            <!-- Content will be injected by JavaScript -->
        </div>

        <!-- Footer -->
        <footer class="mt-24 border-t border-slate-900 pt-10 pb-20 text-center">
            <p class="text-[10px] text-slate-600 font-black tracking-[0.3em] uppercase">
                Kyopure Strategic Interface // Visual Analytics
            </p>
        </footer>
    </div>

    <script>
        // --- Data Definitions ---
        // サンプル画像を設定。本来はカードのイラストURLをここに格納します。
        const SAMPLE_IMG = "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&w=400&q=80";

        const DECK_DATA = [
            { id: 'apollo', name: '赤白アポロ', share: 15, color: '#EF4444', img: "https://images.unsplash.com/photo-1550684848-fac1c5b4e853?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'outrage', name: 'アウトレイジ', share: 15, color: '#F97316', img: "https://images.unsplash.com/photo-1579546673177-471f641881d4?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'endurance', name: '耐久', share: 10, color: '#60A5FA', img: "https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'linne', name: 'リンネ', share: 5, color: '#9333EA', img: "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'jokers', name: 'ジョーカーズ', share: 5, color: '#FACC15', img: "https://images.unsplash.com/photo-1508739773434-c26b3d09e071?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'metallica', name: 'メタリカ', share: 5, color: '#94A3B8', img: "https://images.unsplash.com/photo-1558591710-4b4a1ad0f048?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'nero', name: 'ネロ天門', share: 5, color: '#4338CA', img: "https://images.unsplash.com/photo-1464802686167-b939a6910659?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'vv8', name: 'VV8', share: 5, color: '#06B6D4', img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'alien', name: 'エイリアン', share: 5, color: '#16A34A', img: "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=400&q=80" }, 
            { id: 'buster', name: '赤黒バスター', share: 0, color: '#991B1B', img: "https://images.unsplash.com/photo-1502134249126-9f3755a50d78?auto=format&fit=crop&w=400&q=80" }, 
        ];

        const WIN_RATES = {
            'apollo': { 'outrage': 30, 'endurance': 45, 'linne': 60, 'jokers': 60, 'metallica': 70, 'nero': 40, 'vv8': 50, 'alien': 30, 'buster': 55 },
            'outrage': { 'apollo': 70, 'endurance': 50, 'linne': 55, 'jokers': 65, 'metallica': 60, 'nero': 30, 'vv8': 40, 'alien': 70, 'buster': 65 },
            'endurance': { 'apollo': 55, 'outrage': 50, 'linne': 70, 'jokers': 60, 'metallica': 60, 'nero': 40, 'vv8': 20, 'alien': 30, 'buster': 65 },
            'linne': { 'apollo': 35, 'outrage': 60, 'endurance': 60, 'jokers': 30, 'metallica': 60, 'nero': 70, 'vv8': 20, 'alien': 60, 'buster': 65 },
            'jokers': { 'apollo': 35, 'outrage': 35, 'endurance': 40, 'linne': 70, 'metallica': 35, 'nero': 70, 'vv8': 70, 'alien': 70, 'buster': 55 },
            'metallica': { 'apollo': 30, 'outrage': 40, 'endurance': 40, 'linne': 40, 'jokers': 65, 'nero': 60, 'vv8': 60, 'alien': 65, 'buster': 45 },
            'nero': { 'apollo': 60, 'outrage': 70, 'endurance': 60, 'linne': 30, 'jokers': 30, 'metallica': 40, 'vv8': 50, 'alien': 40, 'buster': 65 },
            'vv8': { 'apollo': 50, 'outrage': 60, 'endurance': 80, 'linne': 80, 'jokers': 30, 'metallica': 40, 'nero': 50, 'alien': 70, 'buster': 65 },
            'alien': { 'apollo': 70, 'outrage': 30, 'endurance': 70, 'linne': 40, 'jokers': 30, 'metallica': 35, 'nero': 60, 'vv8': 30, 'buster': 45 },
            'buster': { 'apollo': 45, 'outrage': 35, 'endurance': 35, 'linne': 35, 'jokers': 45, 'metallica': 55, 'nero': 35, 'vv8': 35, 'alien': 55 },
        };

        // --- View Engine ---
        function getCellColor(rate) {
            if (rate === undefined || rate === null) return 'rgba(30, 41, 59, 0.5)';
            if (rate >= 65) return 'rgba(22, 163, 74, 0.8)'; 
            if (rate >= 55) return 'rgba(34, 197, 94, 0.4)'; 
            if (rate >= 45) return 'rgba(234, 179, 8, 0.2)';  
            if (rate >= 35) return 'rgba(239, 68, 68, 0.4)';  
            return 'rgba(185, 28, 28, 0.8)'; 
        }

        function renderMatrix() {
            const content = document.getElementById('content-area');
            
            let html = `
                <div class="space-y-8 animate-in fade-in duration-700">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Dominant Deck</p>
                            <p class="text-sm font-black">アウトレイジ</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Aggro King</p>
                            <p class="text-sm font-black">赤白アポロ</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                            <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">Peak Win Rate</p>
                            <p class="text-sm font-black text-green-400">リンネ (54.8%)</p>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-center gap-2">
                             <div class="w-3 h-3 rounded bg-green-600"></div>
                             <div class="w-3 h-3 rounded bg-yellow-500/20"></div>
                             <div class="w-3 h-3 rounded bg-red-700"></div>
                             <span class="text-[10px] font-bold text-slate-500 ml-1 uppercase">Win Grade</span>
                        </div>
                    </div>

                    <div class="relative overflow-x-auto rounded-2xl border border-slate-800 shadow-2xl bg-slate-950">
                        <table class="w-full border-collapse">
                            <thead>
                                <tr class="bg-slate-900">
                                    <th class="p-4 border-b border-r border-slate-800 sticky left-0 z-30 min-w-[160px] bg-slate-900 text-[10px] text-slate-500 font-black text-left">
                                        ATTACKER ↓
                                    </th>
                                    ${DECK_DATA.map(deck => `
                                        <th class="p-4 border-b border-slate-800 min-w-[120px] text-center deck-cell-bg relative" style="background-image: url('${deck.img}')">
                                            <div class="header-cell-overlay"></div>
                                            <div class="relative z-10 flex flex-col items-center">
                                                <div class="w-2 h-2 rounded-full mb-1" style="background-color: ${deck.color}"></div>
                                                <span class="text-[10px] font-black uppercase tracking-tighter text-white drop-shadow-lg">${deck.name}</span>
                                                <span class="text-[9px] text-slate-300 font-bold">${deck.share}%</span>
                                            </div>
                                        </th>
                                    `).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${DECK_DATA.map(attacker => `
                                    <tr>
                                        <td class="p-4 border-r border-b border-slate-800 sticky left-0 z-10 font-black text-[11px] deck-cell-bg" 
                                            style="background-image: url('${attacker.img}')">
                                            <div class="deck-cell-overlay"></div>
                                            <div class="relative z-10 flex items-center gap-3">
                                                <div class="w-1.5 h-6 rounded-full" style="background-color: ${attacker.color}"></div>
                                                <span class="uppercase text-white drop-shadow-md tracking-tight">${attacker.name}</span>
                                            </div>
                                        </td>
                                        ${DECK_DATA.map(defender => {
                                            const rate = WIN_RATES[attacker.id]?.[defender.id];
                                            const isSelf = attacker.id === defender.id;
                                            if (isSelf) return `<td class="p-0 border-b border-slate-800/50 bg-slate-950/50"></td>`;
                                            return `
                                                <td class="p-0 border-b border-slate-800/50 border-r border-slate-800/20" 
                                                    onclick="renderDetail('${attacker.id}', '${defender.id}')">
                                                    <div class="w-full h-14 flex items-center justify-center font-black text-xs cursor-pointer cell-hover transition-all" 
                                                         style="background-color: ${getCellColor(rate)}">
                                                        ${rate || '-'}
                                                    </div>
                                                </td>
                                            `;
                                        }).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            content.innerHTML = html;
        }

        function renderDetail(attackerId, defenderId) {
            const attacker = DECK_DATA.find(d => d.id === attackerId);
            const defender = DECK_DATA.find(d => d.id === defenderId);
            const rate = WIN_RATES[attackerId]?.[defenderId] || 50;
            const content = document.getElementById('content-area');

            let html = `
                <div class="animate-in fade-in slide-in-from-right duration-300">
                    <button onclick="renderMatrix()" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-white transition-colors text-xs font-black uppercase tracking-widest">
                        ← Back to Matrix
                    </button>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Matchup Banner with Background -->
                        <div class="lg:col-span-3 rounded-2xl p-10 flex flex-col md:flex-row items-center justify-around gap-12 text-white shadow-2xl relative overflow-hidden border border-slate-700">
                            <div class="absolute inset-0 bg-slate-900 opacity-90 z-0"></div>
                            <div class="absolute inset-0 z-0 opacity-20 bg-cover bg-center" style="background-image: url('${attacker.img}')"></div>
                            
                            <div class="text-center relative z-10">
                                <div class="w-28 h-28 rounded-full mx-auto mb-4 flex items-center justify-center shadow-2xl border-4 border-slate-700 bg-cover bg-center" 
                                     style="background-image: url('${attacker.img}')">
                                </div>
                                <h2 class="text-2xl font-black uppercase tracking-tighter">${attacker.name}</h2>
                                <span class="text-slate-400 text-[10px] font-black tracking-widest uppercase">Attacker Side</span>
                            </div>
                            
                            <div class="text-center relative z-10 bg-slate-950/50 p-6 rounded-3xl border border-white/10 backdrop-blur-sm">
                                <div class="text-7xl font-black mb-1 ${rate >= 60 ? 'text-green-400' : rate <= 40 ? 'text-red-400' : 'text-yellow-400'}">
                                    ${rate}%
                                </div>
                                <div class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500">Predicted Edge</div>
                            </div>

                            <div class="text-center relative z-10">
                                <div class="w-28 h-28 rounded-full mx-auto mb-4 flex items-center justify-center shadow-2xl border-4 border-slate-700 bg-cover bg-center" 
                                     style="background-image: url('${defender.img}')">
                                </div>
                                <h2 class="text-2xl font-black uppercase tracking-tighter">${defender.name}</h2>
                                <span class="text-slate-400 text-[10px] font-black tracking-widest uppercase">Defender Side</span>
                            </div>
                        </div>

                        <!-- Analysis -->
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
                                <h3 class="text-lg font-black mb-6 flex items-center gap-2 uppercase tracking-tight">
                                    <span class="text-yellow-500">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                                    </span>
                                    Tactical Insight
                                </h3>
                                <div class="p-6 bg-slate-900 rounded-xl border border-slate-700 text-sm text-slate-300 leading-relaxed shadow-inner">
                                    <p class="font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2">
                                        <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                                        競技調整チーム・分析ログ
                                    </p>
                                    <ul class="space-y-4">
                                        <li class="flex gap-4">
                                            <span class="text-yellow-500 font-black text-lg">01.</span>
                                            <div>
                                                <b class="text-slate-100 block mb-1">ハンデス＆リソース管理</b>
                                                《ジェニージェーン》による複数枚ハンデスを想定し、マナ加速や墓地リソースを優先的に活用。
                                            </div>
                                        </li>
                                        <li class="flex gap-4">
                                            <span class="text-yellow-500 font-black text-lg">02.</span>
                                            <div>
                                                <b class="text-slate-100 block mb-1">盾の踏み方とトリガーケア</b>
                                                相手が「クロック」採用圏内であれば、ジャストキルではなく常に+1打点以上の構築を維持。
                                            </div>
                                        </li>
                                        <li class="flex gap-4">
                                            <span class="text-yellow-500 font-black text-lg">03.</span>
                                            <div>
                                                <b class="text-slate-100 block mb-1">環境特有のロック回避</b>
                                                アルカディアス着地後の「詰み」を避けるため、光以外の除去札を手札にキープする。
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- Sidebar Cards -->
                        <div class="space-y-6">
                            <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
                                <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em] mb-4">Focus Card</h3>
                                <div class="space-y-3">
                                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 relative overflow-hidden group cursor-pointer">
                                        <div class="absolute inset-0 bg-yellow-500/5 group-hover:bg-yellow-500/10 transition-colors"></div>
                                        <div class="relative z-10">
                                            <div class="text-[9px] text-yellow-500 font-bold mb-1 uppercase tracking-widest">Crucial Unit</div>
                                            <div class="font-bold text-sm text-white">ジェニージェーン</div>
                                            <p class="text-[10px] text-slate-500 mt-2">出た時ハンデス+スレイヤーブロッカー。1枚でゲームを支配するスペック。</p>
                                        </div>
                                    </div>
                                    <div class="p-4 bg-slate-900 rounded-xl border border-slate-700 opacity-40">
                                        <div class="font-bold text-[10px] text-slate-400">ザ・クロック (ST)</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            content.innerHTML = html;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize App
        window.onload = () => {
            renderMatrix();
        };
    </script>
</body>
</html>
